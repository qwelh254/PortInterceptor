# Surge / Loon 示例配置（含广告、追踪、遥测拦截规则）
# 导入后在「连接」页打开「拦截开关」，即可看到拦截次数实时增长
[General]
loglevel = notify
dns-server = 1.1.1.1, 8.8.8.8

[Proxy]
香港-示例01 = ss, hk.example.com, 8388, aes-256-gcm, your-password
日本-示例02 = vmess, jp.example.com, 443, username=12345678-1234-1234-1234-123456789abc, tls=true, ws=true, ws-path=/ray
美国-示例03 = trojan, us.example.com, 443, your-password, sni=us.example.com
代理-HTTP = http, proxy.example.com, 8080, user, pass

[Proxy Group]
🚀 节点选择 = select, ♻️ 自动选择, 香港-示例01, 日本-示例02, 美国-示例03, DIRECT
♻️ 自动选择 = url-test, 香港-示例01, 日本-示例02, 美国-示例03, url=http://www.gstatic.com/generate_204, interval=300

