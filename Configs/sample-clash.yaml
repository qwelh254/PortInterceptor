# Clash 示例配置（导入后可在「规则测试」页验证分流）
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info

proxies:
  - name: 香港-示例01
    type: ss
    server: hk.example.com
    port: 8388
    cipher: aes-256-gcm
    password: "your-password"
    udp: true
  - name: 日本-示例02
    type: vmess
    server: jp.example.com
    port: 443
    uuid: 12345678-1234-1234-1234-123456789abc
    alterId: 0
    cipher: auto
    tls: true
    network: ws
    ws-opts:
      path: /ray
      headers:
        Host: jp.example.com
  - name: 美国-示例03
    type: trojan
    server: us.example.com
    port: 443
    password: "your-password"
    sni: us.example.com
    skip-cert-verify: false

proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - 香港-示例01
      - 日本-示例02
      - 美国-示例03
      - DIRECT
  - name: ♻️ 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - 香港-示例01
      - 日本-示例02
      - 美国-示例03

rules:
  # ── 广告拦截 ──
  - DOMAIN-SUFFIX,doubleclick.net,REJECT
  - DOMAIN-SUFFIX,googlesyndication.com,REJECT
  - DOMAIN-SUFFIX,googleadservices.com,REJECT
  - DOMAIN-SUFFIX,adcolony.com,REJECT
  - DOMAIN-SUFFIX,applovin.com,REJECT
  - DOMAIN-SUFFIX,unityads.unity3d.com,REJECT
  - DOMAIN-SUFFIX,chartboost.com,REJECT
  - DOMAIN-SUFFIX,inmobi.com,REJECT
  - DOMAIN-SUFFIX,mintegral.com,REJECT
  - DOMAIN-SUFFIX,vungle.com,REJECT
  - DOMAIN-SUFFIX,ironsource.com,REJECT
  - DOMAIN-KEYWORD,adservice,REJECT
  - DOMAIN-KEYWORD,advertising,REJECT
  # ── 追踪 / 统计 / 遥测 ──
  - DOMAIN-SUFFIX,google-analytics.com,REJECT
  - DOMAIN-SUFFIX,app-measurement.com,REJECT
  - DOMAIN-SUFFIX,mixpanel.com,REJECT
  - DOMAIN-SUFFIX,amplitude.com,REJECT
  - DOMAIN-SUFFIX,segment.io,REJECT
  - DOMAIN-SUFFIX,umeng.com,REJECT
  - DOMAIN-SUFFIX,bugly.qq.com,REJECT
  - DOMAIN-SUFFIX,talkingdata.com,REJECT
  - DOMAIN-SUFFIX,growingio.com,REJECT
  - DOMAIN-SUFFIX,appsflyer.com,REJECT
  - DOMAIN-SUFFIX,adjust.com,REJECT
  - DOMAIN-SUFFIX,telemetry.microsoft.com,REJECT
  - DOMAIN-KEYWORD,analytics,REJECT
