name: PortInterceptor
options:
  bundleIdPrefix: com.worksin
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

# Yams 是一个 Swift 的 YAML 解析库，用于解析 Clash 配置
# 首次打开工程时 Xcode 会自动联网下载，无需手动安装
packages:
  Yams:
    url: https://github.com/jpsim/Yams.git
    from: 5.1.3

targets:
  PortInterceptor:
    type: application
    platform: iOS
    sources:
      - path: PortInterceptor
        excludes:
          - Info.plist
    dependencies:
      - package: Yams
    settings:
      base:
        # 与企业描述文件（VD7465CKUB）绑定的 Bundle ID 精确匹配
        PRODUCT_BUNDLE_IDENTIFIER: com.worksin.one
        INFOPLIST_FILE: PortInterceptor/Info.plist
        MARKETING_VERSION: "4.2"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"

# 注：VPN 扩展（PacketTunnel）已从构建中移除——
# 该描述文件不含 Network Extension 权限，且不包含扩展子 ID，无法签名。
# 本地 WiFi 代理功能完整保留，是当前证书下唯一可用的拦截方案。
